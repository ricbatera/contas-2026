server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A API fica na mesma origem do frontend, então o backend não precisa de CORS.
    location /api/ {
        # Upload de fatura em PDF (até 10 MB, ~13,4 MB em base64) e leitura por IA, que pode demorar.
        client_max_body_size 20m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (outputHashing=all) podem ficar em cache por muito tempo.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback do SPA: rotas do Angular caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
