# Rate limit por IP, primeira barreira contra excesso de requisições (o backend tem a sua também).
# Se houver outro proxy na frente deste servidor, configure real_ip_header/set_real_ip_from,
# senão todos os usuários aparecem com o IP do proxy e dividem o mesmo limite.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req_status 429;
    limit_conn_status 429;

    # Clientes lentos de propósito (slowloris) não seguram conexões abertas.
    client_header_timeout 15s;
    client_body_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A API fica na mesma origem do frontend, então o backend não precisa de CORS.
    # Login, cadastro e refresh: limite bem menor, contra força bruta.
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_conn conexoes 20;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn conexoes 20;
        # Upload de fatura em PDF (até 10 MB, ~13,4 MB em base64) e leitura por IA, que pode demorar.
        client_max_body_size 20m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (outputHashing=all) podem ficar em cache por muito tempo.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback do SPA: rotas do Angular caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
