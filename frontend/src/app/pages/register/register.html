<div class="circle">
  <h1>REGISTER</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field" [class.invalid]="invalid('nome')">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z" /></svg>
      </span>
      <input type="text" formControlName="nome" placeholder="Nome" autocomplete="given-name" />
    </div>
    <div class="field" [class.invalid]="invalid('sobrenome')">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z" /></svg>
      </span>
      <input type="text" formControlName="sobrenome" placeholder="Sobrenome" autocomplete="family-name" />
    </div>
    <div class="field" [class.invalid]="invalid('email')">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 8L4 7v2l8 5 8-5V7l-8 5z" /></svg>
      </span>
      <input type="email" formControlName="email" placeholder="Email" autocomplete="email" />
    </div>
    <div class="field" [class.invalid]="invalid('senha')">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z" /></svg>
      </span>
      <input type="password" formControlName="senha" placeholder="Senha (8+, número e símbolo)" autocomplete="new-password" />
    </div>
    <div class="field" [class.invalid]="invalid('telefone')">
      <span class="icon">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z" /></svg>
      </span>
      <input type="tel" formControlName="telefone" placeholder="Telefone (opcional)" autocomplete="tel" />
    </div>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button type="submit" [disabled]="loading()">{{ loading() ? '...' : 'REGISTER' }}</button>
    <span class="switch">Já tem conta? <a routerLink="/login">Entrar</a></span>
  </form>
</div>
