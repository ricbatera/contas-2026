# Uso: docker compose --env-file .env-prod up -d --build
# Os segredos ficam em .env-prod (não versionado). Veja .env-prod.example.
name: financas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina em .env-prod}
      POSTGRES_USER: ${POSTGRES_USER:?defina em .env-prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env-prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?defina em .env-prod}
      DB_USERNAME: ${POSTGRES_USER:?defina em .env-prod}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?defina em .env-prod}
      JWT_SECRET: ${JWT_SECRET:?defina em .env-prod}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SWAGGER_ENABLED:-false}
      SPRINGDOC_API_DOCS_ENABLED: ${SWAGGER_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  pgdata:
