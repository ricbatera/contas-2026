spring.datasource.url=jdbc:h2:mem:financas-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

jwt.secret=test-secret-key-for-junit-tests-only-32bytes-min
jwt.issuer=financas-api-test
jwt.access-token-expiration=1h
jwt.refresh-token-expiration=30d
