# Testes rodam contra PostgreSQL real para validar as migrations do Flyway.
# Padrão: banco financas_test no Postgres local (container postgres-financas no WSL).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/financas_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:}

# Credenciais locais (não versionado): src/test/resources/application-test-local.properties
spring.config.import=optional:classpath:application-test-local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# TestFlywayConfig limpa e recria o schema a cada contexto Spring; db/testmigration
# contém tabelas usadas só em testes (ex.: tenant_test_entity).
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/testmigration

jwt.secret=test-secret-key-for-junit-tests-only-32bytes-min
jwt.issuer=financas-api-test
jwt.access-token-expiration=1h
jwt.refresh-token-expiration=30d

ia.chave-criptografia=dGVzdC1vbmx5LWNoYXZlLWlhLTMyLWJ5dGVzLTEyMzQ=
