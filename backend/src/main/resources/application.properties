spring.application.name=financas

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Schema versionado em src/main/resources/db/migration. Bancos que já existiam antes do
# Flyway (sem flyway_schema_history) são marcados na V1 sem executá-la.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

jwt.secret=${JWT_SECRET}
jwt.issuer=financas-api
jwt.access-token-expiration=1h
jwt.refresh-token-expiration=30d

# Chave AES-256 (base64, 32 bytes) que cifra as API keys dos provedores de IA.
# Trocar a chave torna ilegíveis as API keys já gravadas.
ia.chave-criptografia=${IA_CRYPTO_KEY}
